[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[unix_http_server]
file=/var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 1024x768x24
autostart=true
autorestart=true
user=root
stdout_logfile=/var/log/supervisor/xvfb.log
stderr_logfile=/var/log/supervisor/xvfb.err.log

[program:mt5]
command=/usr/local/bin/start_mt5.sh
autostart=true
autorestart=true
user=root
stdout_logfile=/var/log/supervisor/mt5.log
stderr_logfile=/var/log/supervisor/mt5.err.log
environment=DISPLAY=:99,WINEPREFIX=/root/.wine,PYTHONIOENCODING=utf-8

[program:nyx-bot]
command=python3 /app/main.py
directory=/app
autostart=true
autorestart=true
user=root
stdout_logfile=/var/log/supervisor/nyx-bot.log
stderr_logfile=/var/log/supervisor/nyx-bot.err.log
environment=DISPLAY=:99,WINEPREFIX=/root/.wine,PYTHONIOENCODING=utf-8,SIGNAL_BRIDGE_MODE=true
